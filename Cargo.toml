[package]
name = "tkeep"
version = "0.1.0"
edition = "2024"
build = "build.rs"
default-run = "tkeep"
description = "TKEEP is a session keep tool"


[[bin]]
name = "tserver"
path = "src/tserver.rs"

[[bin]]
name = "tclient"
path = "src/tclient.rs"


[dependencies]
better-panic = "0.3.0"
bincode = "2.0.1"
bytes = "1.9.0"
check = "1.0.0"
clap = { version = "4.5.20", features = [
    "derive",
    "cargo",
    "wrap_help",
    "unicode",
    "string",
    "unstable-styles",
] }
color-eyre = "0.6.3"
config = "0.15.6"
crossterm = { version = "0.29.0", features = ["serde"] }
daemonize = "0.5.0"
directories = "6.0.0"
human-panic = "2.0.2"
json5 = "0.4.1"
lazy_static = "1.5.0"
libc = "0.2.161"
portable-pty = "0.9.0"
pretty_assertions = "1.4.1"
serde = { version = "1.0.211", features = ["derive"] }
serde_json = "1.0.132"
signal-hook = "0.3.17"
signal-hook-tokio = { version = "0.3.1", features = ["futures-v0_3"] }
strip-ansi-escapes = "0.2.0"
strum = { version = "0.27.1", features = ["derive"] }
tokio = { version = "1.40.0", features = ["full"] }
tokio-stream = "0.1.17"
tracing = "0.1.40"
tracing-error = "0.2.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "serde"] }
vte = { version = "0.15.0", features = ["ansi"] }

[build-dependencies]
anyhow = "1.0.90"
vergen-gix = { version = "1.0.2", features = ["build", "cargo"] }
